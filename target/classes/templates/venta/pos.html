<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Punto de Venta - La Máquina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .producto-btn { height: 100px; border-radius: 12px; }
    </style>
</head>
<body>
<div class="container-fluid mt-4">
    <div class="row">
        
        <div class="col-md-8">
            <h4 class="fw-bold mb-3"><i class="bi bi-grid-3x3-gap-fill me-2"></i>Menú de Ventas</h4>
            <div class="row g-3">
                <div class="col-4" th:each="p : ${productos}">
                    <form th:action="@{/venta/agregar}" method="post">
                        <input type="hidden" name="idProducto" th:value="${p.idProducto}">
                        <input type="hidden" name="cantidad" value="1">
                        <button type="submit" class="btn btn-outline-primary w-100 producto-btn d-flex flex-column justify-content-center">
                            <span class="fw-semibold" th:text="${p.nombreProducto}">Casado</span>
                            <span class="small text-muted" th:text="'₡' + ${p.precioVenta}">₡0</span>
                        </button>
                    </form>
                </div>
                <div class="col-12 text-muted" th:if="${#lists.isEmpty(productos)}">
                    No hay productos activos para vender.
                </div>
            </div>
        </div>

        <!-- Carrito: HU-17 -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0"><i class="bi bi-cart-fill me-2"></i>Orden Actual</h5>
                </div>
                <div class="card-body p-0">
                    <table class="table mb-0 align-middle">
                        <tbody>
                            <tr th:each="item, stat : ${carrito}">
                                <td>
                                    <span class="fw-medium" th:text="${item.nombreProducto}">Casado</span>
                                    <div class="small text-muted" th:text="${item.cantidad} + ' x ₡' + ${item.precioUnitario}">1 x ₡0</div>
                                </td>
                                <td class="text-end" th:text="'₡' + ${item.subtotal}">₡0</td>
                                <td class="text-end">
                                    <a th:href="@{/venta/quitar/{i}(i=${stat.index})}" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-x"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(carrito)}">
                                <td colspan="3" class="text-center text-muted py-3">Carrito vacío</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-white">
                    <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
                        <span>Total</span>
                        <span th:text="'₡' + ${total}">₡0</span>
                    </div>

                    <form th:action="@{/venta/cobrar}" method="post" th:if="${!#lists.isEmpty(carrito)}">
                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Cajero</label>
                            <select name="idUsuario" class="form-select" required>
                                <option th:each="u : ${usuarios}" th:value="${u.idUsuario}" th:text="${u.nombre}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">
                            <i class="bi bi-cash-coin me-1"></i> Cobrar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
