<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Insumos Más Gastados - La Máquina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4" style="max-width: 700px;">
    <h3 class="fw-bold mb-4">Insumos Más Gastados</h3>

    <form th:action="@{/reporte/insumos}" method="get" class="row g-2 mb-4">
        <div class="col-5">
            <label class="form-label small">Desde</label>
            <input type="date" name="inicio" class="form-control" th:value="${inicio}" required>
        </div>
        <div class="col-5">
            <label class="form-label small">Hasta</label>
            <input type="date" name="fin" class="form-control" th:value="${fin}" required>
        </div>
        <div class="col-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Ver</button>
        </div>
    </form>

    <table class="table table-hover" th:if="${insumos != null}">
        <thead class="table-light">
            <tr><th>#</th><th>Insumo</th><th>Consumido</th></tr>
        </thead>
        <tbody>
            <tr th:each="i, stat : ${insumos}">
                <td th:text="${stat.count}"></td>
                <td th:text="${i.nombreInsumo}"></td>
                <td th:text="${i.cantidadConsumida} + ' ' + ${i.unidadMedida}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(insumos)}">
                <td colspan="3" class="text-center text-muted py-3">Sin consumo en ese rango.</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
