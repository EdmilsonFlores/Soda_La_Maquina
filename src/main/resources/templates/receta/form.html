<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Definir Receta - La Máquina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style> body { background-color: #f8f9fa; } </style>
</head>
<body>
<div class="container mt-4" style="max-width: 800px;">
    <a th:href="@{/receta/listado}" class="btn btn-outline-secondary btn-sm mb-3">
        <i class="bi bi-arrow-left"></i> Volver
    </a>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <h4 class="fw-bold mb-0">
                Receta de: <span th:text="${producto.nombreProducto}">Casado</span>
            </h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/receta/guardar}" method="post">
                <input type="hidden" name="idProducto" th:value="${producto.idProducto}">

                <table class="table align-middle" id="tablaDetalles">
                    <thead>
                        <tr>
                            <th>Insumo</th>
                            <th style="width: 160px;">Cantidad</th>
                            <th style="width: 50px;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- filas existentes de la receta, si ya tiene -->
                        <tr th:if="${receta != null}" th:each="d : ${receta.detalles}">
                            <td>
                                <select name="idInsumo" class="form-select">
                                    <option th:each="i : ${insumos}"
                                            th:value="${i.idInsumo}"
                                            th:selected="${i.idInsumo == d.insumo.idInsumo}"
                                            th:text="${i.nombre} + ' (' + i.unidadMedida + ')'">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <input type="number" step="0.001" name="cantidadUtilizada"
                                       class="form-control" th:value="${d.cantidadUtilizada}" required>
                            </td>
                            <td>
                                <button type="button" class="btn btn-outline-danger btn-sm" onclick="this.closest('tr').remove()">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <button type="button" class="btn btn-outline-primary btn-sm mb-4" onclick="agregarFila()">
                    <i class="bi bi-plus-lg me-1"></i> Agregar insumo
                </button>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/receta/listado}" class="btn btn-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i> Guardar Receta</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var insumosDisponibles = /*[[${insumos}]]*/ [];
    /*]]>*/

    function agregarFila() {
        var tbody = document.querySelector('#tablaDetalles tbody');
        var tr = document.createElement('tr');

        var opciones = insumosDisponibles.map(function (i) {
            return '<option value="' + i.idInsumo + '">' + i.nombre + ' (' + i.unidadMedida + ')</option>';
        }).join('');

        tr.innerHTML =
            '<td><select name="idInsumo" class="form-select">' + opciones + '</select></td>' +
            '<td><input type="number" step="0.001" name="cantidadUtilizada" class="form-control" required></td>' +
            '<td><button type="button" class="btn btn-outline-danger btn-sm" onclick="this.closest(\'tr\').remove()"><i class="bi bi-x-lg"></i></button></td>';

        tbody.appendChild(tr);
    }
</script>
</body>
</html>
