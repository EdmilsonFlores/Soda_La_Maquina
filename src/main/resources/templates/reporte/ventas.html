<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Ventas - La Máquina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4" style="max-width: 600px;">
    <h3 class="fw-bold mb-4">Reporte de Ventas e Ingresos</h3>

    <form th:action="@{/reporte/ventas}" method="get" class="row g-2 mb-4">
        <div class="col-5">
            <label class="form-label small">Desde</label>
            <input type="date" name="inicio" class="form-control" th:value="${inicio}" required>
        </div>
        <div class="col-5">
            <label class="form-label small">Hasta</label>
            <input type="date" name="fin" class="form-control" th:value="${fin}" required>
        </div>
        <div class="col-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Ver</button>
        </div>
    </form>

    <div class="row g-3" th:if="${total != null}">
        <div class="col-6">
            <div class="card border-0 shadow-sm p-3">
                <p class="text-muted mb-1 small">Total Facturado</p>
                <h3 class="fw-bold" th:text="'₡' + ${total}">₡0</h3>
            </div>
        </div>
        <div class="col-6">
            <div class="card border-0 shadow-sm p-3">
                <p class="text-muted mb-1 small">Transacciones</p>
                <h3 class="fw-bold" th:text="${transacciones}">0</h3>
            </div>
        </div>
    </div>
</div>
</body>
</html>
