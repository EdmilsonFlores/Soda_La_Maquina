<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recibo de Venta - La Máquina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4" style="max-width: 500px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h4 class="fw-bold text-center mb-1">La Máquina</h4>
            <p class="text-center text-muted small mb-4">Comprobante de venta</p>

            <p class="mb-1"><strong>Venta #</strong> <span th:text="${venta.idVenta}"></span></p>
            <p class="mb-3"><strong>Fecha:</strong> <span th:text="${venta.fechaVenta}"></span></p>

            <table class="table table-sm">
                <thead>
                    <tr><th>Producto</th><th class="text-end">Cant.</th><th class="text-end">Subtotal</th></tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${venta.detalles}">
                        <td th:text="${d.producto.nombreProducto}"></td>
                        <td class="text-end" th:text="${d.cantidad}"></td>
                        <td class="text-end" th:text="'₡' + ${d.subtotal}"></td>
                    </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-between fw-bold fs-5 border-top pt-2">
                <span>Total</span>
                <span th:text="'₡' + ${venta.totalVenta}"></span>
            </div>

            <a th:href="@{/venta/pos}" class="btn btn-primary w-100 mt-4">Nueva Venta</a>
        </div>
    </div>
</div>
</body>
</html>
