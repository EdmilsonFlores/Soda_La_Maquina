<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - La Máquina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #111111; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 380px; border-radius: 16px; }
        .brand-title { font-weight: 800; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="card login-card shadow p-4">
        <div class="text-center mb-4">
            <h3 class="brand-title mb-0">LA MÁQUINA</h3>
            <span class="text-muted small text-uppercase">Panel Administrativo</span>
        </div>

        <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
